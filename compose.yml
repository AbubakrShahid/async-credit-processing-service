name: credit-service

x-app: &app
  build: .
  environment:
    MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    LOG_LEVEL: INFO
    STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-120}
  depends_on:
    mongo:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    <<: *app
    command: ["celery", "-A", "credit_service.worker", "worker", "--loglevel=INFO", "--concurrency=4"]

  # Exactly one beat instance: it schedules the stale-credit sweeper.
  beat:
    <<: *app
    command: ["celery", "-A", "credit_service.worker", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  mongo:
    # 8.0.x refuses to start on Linux kernel >= 6.19 (SERVER-121912); 8.2 runs fine.
    image: mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Transactions need a replica set; initiate a single-node one on first boot.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
  rabbitmq-data:
